# Claude Code CLI Tmux Configuration
# Optimized for remote access from iOS devices

# Enable mouse support for easier mobile interaction
set -g mouse on

# Set prefix to Ctrl-a (easier on mobile keyboards)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Increase scrollback buffer
set-option -g history-limit 50000

# Enable 256 colors
set -g default-terminal "screen-256color"

# Status bar configuration
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '#[fg=green]#H #[fg=yellow]• #[fg=cyan]#S '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M '
set -g status-left-length 50
set -g status-right-length 50

# Window status
setw -g window-status-current-style fg=colour166,bg=default,bright
setw -g window-status-style fg=colour244,bg=default,dim

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240

# Message styling
set -g message-style fg=colour166,bg=colour235

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Renumber windows automatically
set -g renumber-windows on

# Set base index to 1 (easier to reach on mobile)
set -g base-index 1
setw -g pane-base-index 1

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode improvements
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Session management shortcuts for Claude Code
bind-key C new-session -s claude -n main "claude code"
bind-key S command-prompt -p "New Claude session:" "new-session -s claude-%1 -n main 'claude code'"
bind-key L list-sessions

# Automatic session restore
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugin manager (optional - install tmux plugin manager first)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep at bottom)
# run '~/.tmux/plugins/tpm/tpm'